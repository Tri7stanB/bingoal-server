# Base PostgreSQL locale pour le développement : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bingoal
      POSTGRES_USER: bingoal
      POSTGRES_PASSWORD: bingoal
    ports:
      - "5432:5432"
    volumes:
      - bingoal-db:/var/lib/postgresql/data
volumes:
  bingoal-db:
